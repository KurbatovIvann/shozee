packages:
  - "apps/*"
  - "packages/*"
  - "packages/modules/*"

# GHSA-r5fr-rjxr-66jc (CVE-2026-4800): chevrotain 10 still depends on
# lodash 4.17.21 via the better-auth CLI
# (`auth` → `@mrleebo/prisma-ast` → chevrotain). Force the patched 4.18.x
# line already present in the tree (archiver-utils).
#
# Expo SDK 57 CLI (`@expo/plist`, `plist` via xcode/simple-plist, `@expo/xcpretty`)
# still depends on @xmldom/xmldom 0.8.14 / 0.9.11 and js-yaml 4.3.1. Those
# lines have high GHSAs; keep each major on its patched release until Expo
# bumps them. Reachable from apps/mobile and, via @better-auth/expo optional
# peers, from apps/api.
overrides:
  lodash: "^4.18.1"
  js-yaml: "^4.3.2"
  "@xmldom/xmldom@^0.8.0": "0.8.15"
  "@xmldom/xmldom@^0.9.0": "0.9.12"

# SHO-246 / SHO-244: sharp's install script extracts the prebuilt libvips
# binary. pnpm 12 `allowBuilds` replaces `onlyBuiltDependencies`. `true`
# runs the script; `false` is a reviewed deny. Unlisted lifecycle scripts
# fail the install (`strictDepBuilds`). Do not add other `true` entries as
# a workaround for native cutters (no imgproxy).
# onnxruntime-node ships its CPU binaries in the tarball; its postinstall only
# downloads CUDA/TensorRT providers on linux/x64, which Шо never uses.
allowBuilds:
  sharp: true
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  msw: false
  protobufjs: false
  ssh2: false

# Expo SDK 57 Metro (0.84.4 via @expo/metro) still depends on image-size
# 1.2.1. Both high GHSAs list <=2.0.2 with no patched release. Build-time
# parser DoS in Metro, not a Showzy runtime path. Drop when Expo/Metro
# bumps image-size (fnd-T48).
#
# SHO-782: high GHSAs on dev/test-only transitive deps published 2026-09-30
# (undici via vitest>jsdom and @ai-sdk/provider-utils; brace-expansion via
# minimatch in eslint and testcontainers>archiver; @grpc/grpc-js via
# testcontainers>dockerode). Patched releases exist, but pinning them with
# overrides re-resolves the whole Expo peer tree (@types/react 19.2.18 ->
# 19.1.17), the SHO-563 hazard. Ignored until SHO-784 bumps them with a
# reviewed lockfile. No production exists.
#
# SHO-828: node-forge <=1.4.0 (RSA PKCS#1 v1.5 signature verification),
# no patched release. Reachable only through expo > @expo/cli (and
# @expo/code-signing-certificates) — the Expo dev/build CLI, pulled in by
# apps/mobile and transitively by the @better-auth/expo peer tree in
# apps/api. No server or client runtime path imports it, and no production
# exists. Drop when Expo bumps node-forge.
audit:
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-rfgv-xxqx-mfg5
    - GHSA-w293-vg96-wgc3
    - GHSA-vp8m-p9jh-q5pm
    - GHSA-qhr7-859c-m2p7
    - GHSA-6j4f-fj2g-mc7p
    - GHSA-m9gg-hp2v-232j
    - GHSA-86w9-cpqp-85rv
