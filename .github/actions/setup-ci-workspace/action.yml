# Shared Node 22 + pnpm workspace setup for independent CI jobs (SHO-334).
# Each quality job calls this after its own checkout so the jobs do not wait
# on a serial setup job. Caches the pnpm store via setup-node (SHO-333:
# do not cache installed workspace packages).
name: Setup CI workspace
description: pnpm, Node 22, and frozen-lockfile install for independent CI jobs
inputs:
  install:
    description: Install workspace dependencies with a frozen lockfile
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # pnpm 12 is a native executable. pnpm/action-setup v6 npm-bootstraps a
    # JS layout that cannot exec that binary. pnpm/setup downloads @pnpm/exe.
    # install: false — this composite still runs frozen-lockfile itself.
    - name: Set up pnpm (version from packageManager field)
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        install: "false"

    - name: Set up Node 24
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies (frozen lockfile)
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
