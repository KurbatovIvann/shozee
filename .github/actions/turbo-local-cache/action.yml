# Persist Turborepo's local `.turbo` directory across GitHub Actions runs
# (SHO-335). This is GitHub cache, not Vercel remote cache.
# Does not cache installed workspace packages. Skip untrusted fork pull requests.
name: Turbo local cache
description: Restore and save .turbo for this job (pnpm store stays in setup-ci-workspace)
runs:
  using: composite
  steps:
    - name: Restore and save .turbo
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', 'prettier.config.mjs', 'packages/tooling/package.json', 'packages/tooling/tsconfig/base.json', 'packages/tooling/prettier/index.mjs', 'packages/tooling/eslint/base.mjs', 'packages/tooling/eslint/import-boundaries.mjs', 'packages/tooling/eslint/record-verification-aggregates.mjs') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', 'prettier.config.mjs', 'packages/tooling/package.json', 'packages/tooling/tsconfig/base.json', 'packages/tooling/prettier/index.mjs', 'packages/tooling/eslint/base.mjs', 'packages/tooling/eslint/import-boundaries.mjs', 'packages/tooling/eslint/record-verification-aggregates.mjs') }}-${{ github.job }}-
