# CI pipeline v1 (fnd-T2) — the verification gate from docs/pipeline.md
# (Verifier), docs/specs/security-operations.md §7, and docs/blueprint.md
# §7.1(6).
#
# Job names are stable identifiers: branch protection requires them by name
# (docs/operations/branch-protection.md). `e2e-smoke` is the Playwright
# smoke against the built `apps/web` bundle (SHO-331). Maestro mobile e2e
# remains a later phase (fnd-T51). SHO-334 split the former serial `checks`
# body into independent jobs; the job named `checks` is now the fail-closed
# aggregator and must keep that name. SHO-335 persists `.turbo` via GitHub
# Actions cache (not Vercel remote cache) and runs Turbo `--affected` on pull
# requests when the comparison base resolves; `main` stays a full suite.
# SHO-336 splits Vitest into `test-unit` (Turbo/affected, no Postgres) and
# `test-db` (one Vitest process, one PostgreSQL template per job).
#
# All third-party actions are pinned to full commit SHAs (verified against the
# official repos' tags) because this workflow is itself the merge gate.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Push-triggered CI without a PR, e.g. the fnd-T2 seeded-formatting-
      # violation meta-verification. Throwaway branches run the workflow file
      # from their own ref, so gate changes can be exercised before merge.
      - "throwaway/**"
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the GitHub API on pull_request events.
  pull-requests: read
  # Persist `.turbo` with actions/cache (SHO-335). Fork PRs still skip the
  # cache step; this does not introduce a Vercel remote-cache token.
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Format check
        run: time -p pnpm format:check
      - name: Diff hygiene (comments in code, source budget)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          time -p node .claude/scripts/diff-hygiene.mjs --base "origin/$BASE_REF"
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  typecheck:
    runs-on: ubuntu-latest
    env:
      TURBO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch PR base for Turbo affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}" || echo "base fetch failed; run-turbo will use full execution"
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Turbo local cache
        uses: ./.github/actions/turbo-local-cache
      - name: Typecheck (tsc --noEmit)
        run: time -p node packages/tooling/ci/run-turbo.mjs typecheck
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  lint:
    runs-on: ubuntu-latest
    env:
      TURBO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch PR base for Turbo affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}" || echo "base fetch failed; run-turbo will use full execution"
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Turbo local cache
        uses: ./.github/actions/turbo-local-cache
      - name: ESLint
        run: time -p node packages/tooling/ci/run-turbo.mjs lint
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  test-unit:
    runs-on: ubuntu-latest
    env:
      TURBO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch PR base for Turbo affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}" || echo "base fetch failed; run-turbo will use full execution"
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Turbo local cache
        uses: ./.github/actions/turbo-local-cache
      - name: Vitest unit
        run: time -p node packages/tooling/ci/run-turbo.mjs test:unit --concurrency=2
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  test-db:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Export DB harness probe paths
        env:
          SHOWZY_DB_HARNESS_SETUP_COUNT_FILE: "${{ runner.temp }}/showzy-db-setup-count"
          SHOWZY_DB_HARNESS_DB_NAMES_FILE: "${{ runner.temp }}/showzy-db-names"
        run: |
          echo "SHOWZY_DB_HARNESS_SETUP_COUNT_FILE=$SHOWZY_DB_HARNESS_SETUP_COUNT_FILE" >> "$GITHUB_ENV"
          echo "SHOWZY_DB_HARNESS_DB_NAMES_FILE=$SHOWZY_DB_HARNESS_DB_NAMES_FILE" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Assert DB suite collects every on-disk DB test
        run: time -p node packages/tooling/ci/assert-test-suite-collection.mjs
      - name: Vitest DB (one PostgreSQL template)
        run: time -p pnpm test:db
      - name: Assert one PostgreSQL template for this job
        run: node packages/tooling/ci/assert-shared-db-runtime.mjs
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  build-smoke:
    runs-on: ubuntu-latest
    env:
      TURBO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch PR base for Turbo affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}" || echo "base fetch failed; run-turbo will use full execution"
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Turbo local cache
        uses: ./.github/actions/turbo-local-cache
      - name: Expo export smoke (fnd-T48)
        run: time -p node packages/tooling/ci/run-turbo.mjs export:web --filter=@showzy/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Web build smoke (SHO-309)
        run: time -p node packages/tooling/ci/run-turbo.mjs build --filter=@showzy/web
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout (full history — gitleaks scans commits)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  # Dependency gate. GitHub's dependency-review-action is unavailable here
  # (private user-owned repo; it requires a public repo or an organization
  # with GitHub Code Security/Advanced Security), so the gate is `pnpm audit`
  # over the committed lockfile. Switch path is documented in
  # docs/operations/branch-protection.md.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch PR base for lockfile comparison
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}" || echo "base fetch failed; dependency-audit-scope will run pnpm audit"
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Decide whether lockfile or manifests changed
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: node packages/tooling/ci/dependency-audit-scope.mjs
      - name: Set up pnpm (version from packageManager field)
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: "false"
      - name: pnpm audit (fail on high/critical advisories)
        if: steps.scope.outputs.run == 'true'
        run: time -p pnpm audit --audit-level high
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Action/event contract check (core.md §2, fnd-T10)
        # Walks apps/api composition: importing it executes define/implement
        # time validation for every registered action, then runContractCheck
        # (core library) enforces the registry-wide rule matrix. Module tasks
        # register here — never in packages/core.
        run: time -p pnpm --filter @showzy/api contract:check
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Auth schema regeneration reproducibility (fnd-T6)
        # Re-runs the better-auth CLI generation and fails when the committed
        # packages/db/src/schema/auth.ts differs — the generated schema can
        # never drift from the configured better-auth plugin set.
        run: time -p pnpm --filter @showzy/api auth:check
      - name: Migration drift and money schema checks
        run: time -p pnpm --filter @showzy/db db:check
      - name: Runtime database grant integration
        run: time -p pnpm --filter @showzy/db exec vitest run src/foundation.test.ts
      - name: Backup verify dry-run (fnd-T28, db.md §6)
        run: time -p pnpm --filter @showzy/db backup:verify -- --dry-run
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  bundle-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Client bundle probe (contract.md §2, ADR-0016, fnd-T25)
        run: time -p pnpm --filter @showzy/contract bundle:probe
      - name: OpenAPI drift check (contract.md §5, fnd-T25)
        run: time -p pnpm --filter @showzy/contract openapi:check
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup CI workspace
        uses: ./.github/actions/setup-ci-workspace
      - name: Install Playwright Chromium
        run: time -p pnpm --filter @showzy/web exec playwright install --with-deps chromium
      - name: Web Playwright smoke (SHO-331)
        run: time -p pnpm turbo run e2e-smoke --filter=@showzy/web
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-web-smoke
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh

  # Stable branch-protection check name. Succeeds only when every required
  # worker is success. Failure, cancellation, or skip of a needed job cannot
  # produce a green aggregate (if: always() + fail-closed script).
  checks:
    if: always()
    needs:
      - format
      - typecheck
      - lint
      - test-unit
      - test-db
      - build-smoke
      - secret-scan
      - dependency-audit
      - contract-check
      - migration-drift
      - bundle-probe
      - e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Aggregate required gates (fail closed)
        run: >
          node packages/tooling/ci/aggregate-required-gates.mjs
          format=${{ needs.format.result }}
          typecheck=${{ needs.typecheck.result }}
          lint=${{ needs.lint.result }}
          test-unit=${{ needs.test-unit.result }}
          test-db=${{ needs.test-db.result }}
          build-smoke=${{ needs.build-smoke.result }}
          secret-scan=${{ needs.secret-scan.result }}
          dependency-audit=${{ needs.dependency-audit.result }}
          contract-check=${{ needs.contract-check.result }}
          migration-drift=${{ needs.migration-drift.result }}
          bundle-probe=${{ needs.bundle-probe.result }}
          e2e-smoke=${{ needs.e2e-smoke.result }}
      - name: Publish job timing
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: bash packages/tooling/ci/publish-job-timing.sh
