# Local development stack (fnd-T3 / ADR-0027): PostgreSQL 17, two Redis
# instances, Garage.
# Blueprint §3 — prod is the same shape (self-hosted PG/Redis, R2 for S3).
# Dev-only credentials below intentionally match .env.example; real
# environments get secrets through validated env (packages/config), never
# from this file.
#
# Local/CI S3 is Garage (Deuxfleurs); production is Cloudflare R2. The S3
# API is the contract. v2.3.0 `--single-node --default-bucket` creates the
# layout, access key, and `S3_BUCKET` (default `showzy`) on first boot —
# that is the bucket bootstrap (replaces the old MinIO `mc` one-shot).
# Path-style addressing; the website endpoint is not published.

# Explicit project name: the v1 repo's compose project is `showzy` on the
# same machines — this must never collide with it.
name: showzy-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: showzy
      POSTGRES_PASSWORD: showzy
      POSTGRES_DB: showzy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the pg_trgm + unaccent extensions (db.md §3) on first boot.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showzy -d showzy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Two Redis instances, split by what may reach disk (db.md §6, ADR-0039).
  # `redis` holds better-auth secondary storage — plaintext OTP codes — so it
  # gets no persistence volume and no append-only file. `redis-queue` holds
  # durable BullMQ queues (accepted assistant turns), so it persists and never
  # evicts. Both listen on loopback only: neither has a password.
  redis:
    # The shared Redis (`REDIS_URL`): auth secondary storage, rate limits,
    # confirmation challenges, assistant pauses and budget counters, and the
    # worker's safe-to-miss maintenance and pdf jobs.
    image: redis:8-alpine
    # No RDB snapshots and no append-only file: OTP codes never reach disk.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    # The queue Redis: AOF on its own volume, fsync every second, never evict.
    # This is the development form; production must persist the same way
    # (`CONFIG GET appendonly` → yes, `CONFIG GET maxmemory-policy` →
    # noeviction). `REDIS_QUEUE_URL` points here: the worker's assistant queue
    # (SHO-569) and, from SHO-563, the API's producer.
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
      GARAGE_DEFAULT_ACCESS_KEY: showzy-local
      GARAGE_DEFAULT_SECRET_KEY: showzy-local-secret
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-showzy}
    ports:
      - "3900:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-queue-data:
  garage-meta:
  garage-data:
